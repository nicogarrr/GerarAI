name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimos por workflow. Ningun job de CI escribe en el repo, abre PRs ni
# publica releases: `contents: read` es todo lo que `actions/checkout` necesita.
# Declararlo aqui (en vez de confiar en el default del repo) evita que un job
# nuevo herede permisos de escritura sin querer.
permissions:
  contents: read

concurrency:
  # Un grupo por ref: una PR no toca a main ni a otra rama (y al reves).
  # Antes main se agrupaba por SHA: cada merge lanzaba un CI completo y nada se
  # descartaba. El 27-oct, con un merge por minuto, habia 14 runs de main en cola
  # desde hacia una hora y los checks de las PRs esperaban detras
  # (tests/test_ci_concurrency_main.py).
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR -> true: el run viejo ya no describe el codigo que se revisa y lo que
  #   cuesta un runner es lo que se ahorra.
  # main -> false: el run EN CURSO nunca se cancela (no quedan runs a medias ni
  #   checks en un commit viejo). Con el grupo por ref, GitHub solo descarta el run
  #   que aun estaba PENDIENTE y lo sustituye por el del commit mas nuevo: como
  #   mucho un run en curso y uno en espera, y el ultimo commit de main siempre
  #   llega a tener su CI completo. (El rotador de modelos que hacia push directo
  #   a main se retiro en #2294.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dep-parity:
    name: Python dep parity (pyproject ↔ requirements)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # fetch-depth: 1 explicito aunque ya sea el default de checkout@v4+: deja
      # escrita la intension de que este job no lee historial. Sin `cache: pip`
      # a proposito: no instala nada, `sync_requirements.py --check` solo lee
      # pyproject.toml y requirements.txt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verificar paridad de dependencias
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "PR de Dependabot: sincronizando requirements.txt desde pyproject.toml..."
            python data-engine/scripts/sync_requirements.py --write
            git diff --exit-code data-engine/requirements.txt || {
              echo "::warning title=Dependabot dep parity::requirements.txt actualizado acorde a pyproject.toml"
            }
          else
            python data-engine/scripts/sync_requirements.py --check
          fi

  dead-code:
    name: Dead code (alcanzabilidad, baseline E6)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Sin cache ni install: el escaner es estatico puro (git ls-files +
      # parsing), solo necesita el arbol y node, que la imagen ya trae.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Alcanzabilidad contra baseline de inertes conocidos
        run: node scripts/find-dead-code.mjs --fail --baseline scripts/baselines/dead-code.txt

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      MONGODB_URI: mongodb://localhost:27017/cavaai_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      NEXT_PUBLIC_APP_URL: REDACTED_BY_AUDIT
      FMP_BACKEND_URL: http://127.0.0.1:8000
      OPENCODE_GO_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:routes
          # contract-drift: deriva front<->back sobre el OpenAPI comiteado
          # (la frescura del propio openapi.json se verifica en su job).
          # Llevaba verde pero SIN cablear en CI: una deriva nueva no
          # rompia nada. Hallazgos conocidos: contract-drift.allowlist.json.
      - run: npm run test:contract
      - run: npm run check:i18n
      - name: ProPicks guard (R1-R5 + turnover cap)
        run: node --experimental-strip-types --test scripts/propicks-guard.test.ts
      - name: Error cause classification (stale/offline/i18n)
        run: node --experimental-strip-types --test scripts/error-cause.test.ts
      - name: Transaction form validation (F1, no silent submits)
        run: node --experimental-strip-types --test scripts/transaction-validation.test.ts
      - name: Full guard bundle (scripts/*.test.ts, auto-discovered)
        # --coverage: mismo bundle; ademas deja coverage/frontend/guards.lcov
        # con las lineas de lib/ y components/ que los guards ejecutan.
        run: npm run test:guards -- --coverage
      - name: Frontend behaviour tests (Vitest + Testing Library, cobertura con trinquete)
        run: npm run test:coverage
      - name: Frontend coverage summary
        if: ${{ always() }}
        run: |
          if [ -f coverage/frontend/lcov.info ]; then
            npm run --silent coverage:summary | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin informe de Vitest: el paso anterior no llego a generarlo." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Frontend coverage by feature (informativo, no bloquea)
        # Agrupa coverage-summary.json por funcionalidad (impuestos, DCA,
        # cartera, auth...). Sin umbrales: solo resumen y artefacto.
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f coverage/frontend/coverage-summary.json ]; then
            node scripts/frontend-coverage-by-feature.mjs --markdown --json coverage/frontend/coverage-by-feature.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish frontend coverage report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            coverage/frontend/lcov.info
            coverage/frontend/coverage-summary.json
            coverage/frontend/coverage-by-feature.json
            coverage/frontend/guards.lcov
          if-no-files-found: warn
          retention-days: 14
      - name: UI format guards (es-ES, scroll movil)
        run: node --experimental-strip-types --test scripts/ui-format-guard.test.ts
      - name: Market date guard (YYYY-MM-DD no pierde un dia)
        # TZ negativa a posta: las fechas YYYY-MM-DD no deben moverse de dia.
        run: TZ=America/New_York node --experimental-strip-types --test scripts/market-date-guard.test.ts
      - name: SSRF guard (export actions)
        run: node --experimental-strip-types --test scripts/export-url-guard.test.ts
      - name: Portfolio score honesty (ausente != 0)
        run: node --experimental-strip-types --test scripts/portfolio-score-honesty.test.ts
      - name: Thesis date guard (invalid date never renders N/D)
        run: node --experimental-strip-types --test scripts/thesis-memo-date-guard.test.ts
      - run: npm run build
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

  auth-store:
    name: Auth store smoke (Mongo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sign-up and sign-in against ephemeral MongoDB
        run: node scripts/test-auth-signup.mjs

  backend-lint:
    # ruff + pyright en job corto y PARALELO: antes iban dentro de `backend`
    # (18 min), asi que un typo de lint no se sabia hasta instalar torch, y su
    # tiempo se sumaba al camino critico. Aqui el feedback de lint llega en
    # ~2 min y `backend` solo corre tests.
    name: Backend lint (ruff + pyright)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      - run: uv sync --frozen --extra dev --no-install-project
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_ci.db
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      # Instalacion congelada desde uv.lock (mismo criterio que coverage.yml y
      # llm-evals.yml, FIX-3.3/3.4): ruff==0.17.0 y pyright==1.1.414 salen del
      # extra `dev` y pytest/pytest-xdist del extra `test`, todos fijados por
      # el lock. ruff y pyright corren en el job aparte `backend-lint`.
      - run: uv sync --frozen --extra test --extra dev --no-install-project
      # TODO(#fixes): 14 tests preexistentes en rojo en el base del que parte
      # esta rama -- 13 en tests/test_retitle_sec_news_es.py y 1 en
      # tests/test_company_snapshot_batch.py. NO son fallos de CI: en
      # ubuntu-latest pasan. Los 13 mueren en el `os.O_DIRECTORY` de
      # data-engine/scripts/retitle_sec_news_es.py:206, que no existe en win32,
      # asi que solo se ven en el `pytest` de un venv de Windows. Dejarlos
      # anotados para que la ronda de fixes los haga portables y no parezca un
      # fallo nuevo cuando se arreglen.
      - name: Redis local para tests de admision atomica
        run: sudo apt-get update && sudo apt-get install -y redis-server
      # xdist -n 2: la suite son ~11 min single-process y el runner tiene 2
      # vCPU. Los tests que necesitan Qdrant VIVO (marker `services`, solo
      # test_rag_activation.py) van aparte y sin xdist, en el paso de RAG
      # activation, que sigue siendo fail-closed contra el service.
      # El resto de tests que importan qdrant_client usan fakes en memoria.
      # ORDEN IMPORTANTE: la activation va ANTES de la suite porque es quien
      # descarga los modelos de embeddings (cache HF en ~/.cache/huggingface y
      # ONNX de fastembed en /tmp/fastembed_cache). El runner de RAG evals que
      # corre dentro de la suite (test_rag_evals_contracts) es hermetico: con
      # la cache fria abstiene y falla. Antes lo calentaba el propio
      # test_rag_activation al correr dentro del `pytest` unico; al sacarlo
      # con `-m "not services"` hay que ejecutarlo primero a proposito.
      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -fs http://localhost:6333/collections && break || sleep 2; done
      - name: RAG activation against real Qdrant (must not skip)
        env:
          CAVAAI_ENABLE_VECTOR_INGEST: "1"
          CAVAAI_ENABLE_VECTOR_SEARCH: "1"
          CAVAAI_ENABLE_VECTOR_CHAT: "1"
        run: |
          # `set -o pipefail` NO es cosmetico: sin el, el codigo de salida de un
          # `pytest ... | tee log` es el de `tee` (0 siempre) y un test en rojo
          # pasaria. El `grep` de abajo solo caza los skips; este lignea caza los
          # fallos. Los dos hacen falta. Sin xdist A PROPOSITO: son los unicos
          # tests con Qdrant VIVO (marker `services`) y comparten el service.
          set -o pipefail
          uv run --frozen python -m pytest tests/test_rag_activation.py -v -rs | tee /tmp/rag_activation.log
          if grep -Eq "[0-9]+ skipped" /tmp/rag_activation.log; then
            echo "RAG activation tests skipped: Qdrant service not reachable" >&2
            exit 1
          fi
      - run: uv run --frozen python -m pytest -n 2 -m "not services"
      - run: uv run --frozen python scripts/run_financial_evals.py

  evals:
    # Los evals de RAG, valuation, LLM e ingest viven aqui y
    # no dentro de `backend` por dos motivos: `backend` ya esta a 30 min (su
    # timeout) y los evals son el paso mas lento; y un eval en rojo no debe
    # esconderse detras de `pytest`.
    #
    # fail-fast: NO hay matriz a proposito. Con matriz habria que reinstalar
    # requirements.txt (torch incluido) en 6 runners, y con un unico job el
    # equivalente a `fail-fast: false` se consigue con el bucle de abajo: TODOS
    # los evals se ejecutan aunque uno falle y el job sale rojo si alguno fallo.
    # Se pierde el timeline por script en la UI, se gana no gastar 6 runners.
    name: Evals (RAG, valuation, LLM, ingest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_evals_ci.db
      # Vectors ON: los evals de RAG necesitan el motor de verdad. Si
      # un eval se los encuentra apagados se auto-skipearia, que es justo lo que
      # el gate fail-closed de abajo tiene que cazar.
      CAVAAI_ENABLE_VECTOR_INGEST: "1"
      CAVAAI_ENABLE_VECTOR_SEARCH: "1"
      CAVAAI_ENABLE_VECTOR_CHAT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Inventario de scripts de evals presentes en el arbol
        id: discover
        run: |
          present=""
          missing=""
          for s in run_rag_evals run_valuation_evals run_llm_evals run_ingest_evals run_evidence_evals; do
            if [ -f "scripts/$s.py" ]; then
              present="$present $s"
            else
              missing="$missing $s"
            fi
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          {
            if [ -z "$present" ]; then
              echo "## EVALS NO EJECUTADOS: no hay ningun script de evals en el arbol"
            elif [ -n "$missing" ]; then
              echo "## EVALS INCOMPLETOS: se ejecutan solo los presentes"
            else
              echo "## Evals: todos los scripts presentes"
            fi
            echo "Se ejecutan:${present:- ninguno}"
            echo "Ausentes (NO ejecutados):${missing:- ninguno}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Obligatorios: integrados en main y corren verdes en CI
          # (rag, valuation, llm, ingest, evidence). Si se borra o
          # renombra uno, el CI se pone en rojo en vez de quedar en verde.
          required="run_rag_evals run_valuation_evals run_llm_evals run_ingest_evals run_evidence_evals"
          for r in $required; do
            if [ ! -f "scripts/$r.py" ]; then
              echo "::error title=Eval obligatorio ausente::scripts/$r.py no existe"
              echo "EVAL OBLIGATORIO AUSENTE: $r" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          if [ -n "$missing" ]; then
            # Los ficheros los traen otras ramas (D1/D3/E1). No se pone el CI en
            # rojo por un fichero que aun no existe, pero un verde sin evals
            # NUNCA se presenta como verde limpio: anotacion + cabecera del
            # summary dicen exactamente que no se ejecuto.
            echo "::warning title=Evals no ejecutados::scripts ausentes:$missing"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ steps.discover.outputs.present != '' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - name: Instalar dependencias
        if: ${{ steps.discover.outputs.present != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Wait for Qdrant
        if: ${{ steps.discover.outputs.present != '' }}
        run: for i in $(seq 1 30); do curl -fs http://localhost:6333/collections && break || sleep 2; done
      # run_rag_evals mide el RAG de verdad y se niega a correr con un stub
      # (fail-closed). Necesita el modelo de embeddings: se cachea y se
      # precarga con reintentos. Si ni asi se puede descargar, el eval sigue
      # fallando con motivo explicito; nunca se sustituye por un stub.
      - name: Cache del modelo de embeddings (RAG evals)
        if: ${{ steps.discover.outputs.present != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/huggingface
            /tmp/fastembed_cache
          key: embeddings-all-MiniLM-L6-v2-v1
      - name: Precargar el modelo de embeddings (con reintentos)
        if: ${{ steps.discover.outputs.present != '' }}
        run: |
          for i in 1 2 3 4; do
            python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')" && exit 0
            echo "::warning::intento $i de descargar el modelo de embeddings fallo"; sleep $((i * 10))
          done
          echo "::warning title=Modelo de embeddings no disponible::run_rag_evals fallara cerrado (sin stub)"
      - name: "Evals presentes (fail-closed: nada se auto-skipea)"
        if: ${{ steps.discover.outputs.present != '' }}
        env:
          PRESENT: ${{ steps.discover.outputs.present }}
        run: |
          set -o pipefail
          rc=0
          for s in $PRESENT; do
            echo "::group::$s"
            if python "scripts/$s.py" 2>&1 | tee "/tmp/$s.log"; then
              # Mismo patron fail-closed que el gate de RAG activation: un eval
              # que se salta tests porque Qdrant o el LLM no estaban NO es un
              # eval verde, es un eval que no ha evaluado nada.
              if grep -Eq "[0-9]+ skipped" "/tmp/$s.log"; then
                echo "::error::$s reporto tests skipped: Qdrant/LLM no disponible y el eval no es fail-closed"
                rc=1
              fi
            else
              echo "::error::$s fallo"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
      - name: Publica los logs de evals como artefacto
        if: ${{ always() && steps.discover.outputs.present != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evals-logs
          path: /tmp/run_*_evals.log
          if-no-files-found: ignore
          retention-days: 7

  openapi-drift:
    name: OpenAPI generated client drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_openapi_ci.db
      RESEARCH_AUTH_REQUIRED: "false"
    steps:
      # fetch-depth: 1 SUFICE aqui, no hace falta clon completo: `git diff
      # --exit-code` compara el working tree contra el INDICE de HEAD, no contra
      # el log. El drift se detecta igual sin historia.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r data-engine/requirements.txt
      - run: npm run generate:openapi
      # Si hay drift, el rojo dice EXACTAMENTE que regenerar: antes el unico
      # mensaje era el diff de `git diff --exit-code`, que no dice ni el
      # comando ni que hay que commitear los dos ficheros.
      - name: Drift = rojo con las instrucciones exactas
        run: |
          if ! git diff --exit-code -- data-engine/openapi.json lib/research/openapi.generated.ts; then
            echo "::error title=OpenAPI drift::El cliente generado no coincide con el esquema. Regenera y commitea: npm run generate:openapi && git add data-engine/openapi.json lib/research/openapi.generated.ts"
            {
              echo "## OpenAPI drift: los generados no estan al dia"
              echo
              echo "El esquema del backend cambio y los ficheros generados no se regeneraron. En local, desde la raiz del repo:"
              echo
              echo '```bash'
              echo "npm run generate:openapi"
              echo "git add data-engine/openapi.json lib/research/openapi.generated.ts"
              echo '```'
              echo
              echo "(\`npm run generate:openapi\` es \`python data-engine/scripts/export_openapi.py && openapi-typescript data-engine/openapi.json -o lib/research/openapi.generated.ts\`.)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  migrations:
    name: Postgres migration round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: cavaai_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d cavaai_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: data-engine
    env:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@127.0.0.1:5432/cavaai_research
    steps:
      # Alembic lee los ficheros de alembic/versions/ del working tree y su
      # propia tabla de versiones en Postgres: no consulta git en ningun punto.
      # fetch-depth: 1 explicito para que nadie lo cambie a un clon completo
      # sin motivo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # Gate de cadena de Alembic, ANTES de tocar la base de datos.
      #
      # Sin este paso, el unico sintoma de una cadena rota es el efecto
      # secundario críptico del paso siguiente: `alembic upgrade head` aborta
      # con "Multiple head revisions are present for given argument 'head'" y
      # `Dockerfile.prod` (que hace upgrade antes de uvicorn) deja el contenedor
      # sin arrancar. El mensaje no dice que fichero duplica el prefijo, ni que
      # hay que renombrar; este gate lo dice antes y en el sitio.
      #
      # Doble cinturon a proposito:
      #   1. `alembic heads | wc -l` sobre la herramienta real, que es la que
      #      aborta en produccion.
      #   2. `test_alembic_chain.py`, que ademas caza lo que `heads` no ve
      #      (prefijo de 4 digitos duplicado, revision != stem, down_revision
      #      huerfano, ciclo, rama colgante) y explica el por que.
      - name: Gate de cadena de Alembic (un solo head)
        run: |
          set -euo pipefail
          heads=$(python -m alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "::error::alembic tiene $heads heads; la cadena debe ser lineal"
            python -m alembic heads
            exit 1
          fi
          python -m pip install --quiet pytest
          python -m pytest tests/test_alembic_chain.py -q
      - name: Empty database to head
        run: python -m alembic upgrade head
      - name: 0032 rejects a clean downgrade (forward-only)
        # 0032 es forward-only a proposito (restaurar los unique globales
        # reabriria el IntegrityError cross-tenant). El round-trip de
        # downgrade solo cubre revisiones ANTERIORES; aqui se verifica que
        # 0032 rechaza el downgrade sin dejar DDL parcial.
        run: |
          # Con 0033 en head, primero baja 0033 (downgrade limpio y verificado);
          # si no, el raise de 0032 revertiria en la misma transaccion tambien
          # el downgrade de 0033 y `current` quedaria en 0033.
          python -m alembic downgrade 0032_tenant_uniques_fk_actions
          if python -m alembic downgrade 0031_propick_runs; then
            echo "0032 downgrade should have raised (forward-only)" >&2
            exit 1
          fi
          python -m alembic current | grep -q "0032_tenant_uniques_fk_actions"
          python -c "
          import os
          import sqlalchemy as sa

          engine = sa.create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              names = sa.inspect(conn).get_unique_constraints('fund_managers')
          assert any(c['name'] == 'uq_fund_manager_tenant_cik' for c in names), names
          print('0032 schema intacto tras el raise: uq_fund_manager_tenant_cik existe')
          "
      - name: Pre-0032 round trip on a fresh database
        # El round-trip de downgrade cubre solo revisiones < 0032, asi que
        # necesita una base limpia (desde head no se puede bajar de 0032).
        run: |
          python -c "
          import os
          import sqlalchemy as sa

          engine = sa.create_engine(os.environ['DATABASE_URL'], isolation_level='AUTOCOMMIT')
          with engine.connect() as conn:
              conn.execute(sa.text('DROP SCHEMA public CASCADE'))
              conn.execute(sa.text('CREATE SCHEMA public'))
          "
          python -m alembic upgrade 0031_propick_runs
          python -m alembic downgrade base
          python -m alembic upgrade 0006_fundamental_model_journal
          python -m alembic downgrade base
          python -m alembic upgrade head

  arm64-smoke:
    name: ARM64 compatibility smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_arm_ci.db
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_SEARCH: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
      CI: "true"
      MONGODB_URI: mongodb://localhost:27017/cavaai_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      NEXT_PUBLIC_APP_URL: REDACTED_BY_AUDIT
      FMP_BACKEND_URL: http://127.0.0.1:8000
      OPENCODE_GO_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      # `cache: pip` anadido: este job instala torch + requirements.txt
      # (pandas, scipy, sentence-transformers) en un runner ARM64, que es el
      # install mas caro del workflow. La cache no cubre el wheel de torch
      # --index-url https://download.pytorch.org/whl/cpu, que esta en otro
      # indice, pero si todo lo demas.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      # Mismo orden que data-engine/Dockerfile.prod: torch CPU-only primero
      # (indice oficial PyTorch, tiene wheels linux/aarch64) y luego el resto.
      # Asi CI prueba la estrategia exacta de la imagen de Oracle y evita
      # descargar los wheels CUDA (multi-GB) tambien en CI.
      - name: Install torch CPU-only on ARM64 (same as Dockerfile.prod)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend deps on ARM64 (pandas, scipy, sentence-transformers)
        run: python -m pip install -r data-engine/requirements.txt
      - name: Import backend app on ARM64
        working-directory: data-engine
        run: python -c "import platform; from main import app; print('backend import OK on', platform.machine())"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend on ARM64 (native modules like tailwind oxide and sharp)
        run: npm run build

  supply-chain:
    name: Dependency audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      # Dos pasos bloqueantes: produccion (--omit=dev) y el arbol completo
      # (incluye desarrollo). Se mantienen separados para que el log diga si la
      # advisory llega a lo que se envia o solo a la cadena de desarrollo.
      # El segundo fue informativo (`continue-on-error`) mientras
      # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3) no tenia parche; GitHub retiro esa
      # advisory y `npm audit` del arbol completo vuelve a dar 0 hallazgos, asi
      # que vuelve a bloquear como pedia el recordatorio de #806.
      - name: Audit npm dependencies (produccion)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit npm dependencies (incluye desarrollo)
        if: ${{ always() }}
        run: npm audit --audit-level=high
      # `if: always()` en los dos pasos de pip: un `npm audit` en rojo no debe
      # dejar el lado Python sin auditar. Los dos hallazgos se ven juntos.
      - name: Install pip-audit
        if: ${{ always() }}
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        if: ${{ always() }}
        # Sin --ignore-vuln: PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp, nltk 3.10.3,
        # transitiva de llama-index-core) quedo corregida en nltk 3.10.4, que es
        # la que resuelve requirements.txt y la que fija uv.lock. Si vuelve a
        # hacer falta ignorar algo, que sea con fecha y motivo aqui mismo.
        run: python -m pip_audit -r data-engine/requirements.txt

  e2e:
    name: Research API E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: cavaai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d cavaai_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      APP_ENV: test
      E2E_RUN: "1"
      E2E_API_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@127.0.0.1:5432/cavaai_e2e
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r data-engine/requirements.txt
      - run: python -m alembic upgrade head
        working-directory: data-engine
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      E2E_UI_RUN: "1"
      RESEARCH_AUTH_SECRET: cavaai-browser-e2e-research-secret-at-least-32-characters
      # El shell de auth (2FA) consulta Mongo y los jobs de fondo tocan Redis.
      # Sin estos servicios el navegador arrancaba con errores ruidosos que no
      # eran del test, pero podían tumbar la página que se estaba midiendo.
      MONGODB_URI: mongodb://127.0.0.1:27017/cavaai_e2e
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # uv + lock congelado (mismo patron que los demas jobs del repo):
      # `pip install -r requirements.txt` media 1 min 36 s en CI (run
      # 41101995078) incluso con cache de pip (la cache ahorra descargas, no
      # la instalacion); uv sync con cache caliente ~1 s (medido en local).
      # dep-parity garantiza requirements.txt == [project].dependencies, asi
      # que el conjunto instalado es identico.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      - run: npm ci
      - name: Dependencias del backend (uv, lock congelado)
        working-directory: data-engine
        run: uv sync --frozen --no-install-project
      # El 7-oct varios runs agotaron los 30 min en este paso unico (~26 min de
      # `playwright install --with-deps`). Se cachea el navegador por version de
      # Playwright y se separan las dependencias del sistema (apt) de la descarga,
      # cada una con su timeout, para que un tramo lento falle rapido y diga cual.
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache del navegador de Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Dependencias de sistema de Chromium (apt)
        # Mirror apt intermitente; tramo diagnosticado (la descarga del navegador
        # va aparte, con su propio limite de 8 min).
        timeout-minutes: 15
        run: npx playwright install-deps chromium
      - name: Descarga de Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          # El webServer de playwright.config.ts usa `python` salvo que
          # PYTHON_BIN lo pise: hay que apuntarlo al venv de uv.
          PYTHON_BIN: ${{ github.workspace }}/data-engine/.venv/bin/python
      - name: Upload browser report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    # Un unico check de referencia para branch protection, en vez de 11 checks
    # que hay que mantener sincronizados a mano en la configuracion del repo.
    # AVISO: si anades un job a este workflow, anadelo tambien al `needs:` de
    # abajo. GitHub no expone el listado de jobs del run, asi que un job
    # olvidado aqui NO lo ve este gate y puede quedar verde con ese job en rojo.
    name: CI gate (single required check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - dep-parity
      - frontend
      - auth-store
      - backend
      - backend-lint
      - openapi-drift
      - migrations
      - arm64-smoke
      - supply-chain
      - evals
      - e2e
      - browser-e2e
      - dead-code
    # always(): sin esto el gate se saltaria en cuanto un `needs` fallara, que
    # es justo el caso en el que tiene que ejecutarse.
    if: ${{ always() }}
    outputs:
      # Declarado de forma explicita porque es un contrato: quien consuma este
      # gate (otro workflow, un badge, un script) lee `needs.gate.outputs.failed`
      # en vez de parsear el log.
      failed: ${{ steps.report.outputs.failed }}
    steps:
      - name: Resultado agregado
        id: report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # `failure` y `cancelled` tumban el gate. `skipped` NO: un job
          # saltado a proposito (una rama sin cambios, un motor no aplicable)
          # deberia salir con un aviso, no con el gate en rojo y sin explicacion
          # de cual de los dos fue.
          failed=$(echo "$RESULTS" \
            | jq -r 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | map("\(.key)=\(.value.result)") | join(", ")')
          skipped=$(echo "$RESULTS" \
            | jq -r 'to_entries | map(select(.value.result == "skipped")) | map(.key) | join(", ")')
          total=$(echo "$RESULTS" | jq -r 'to_entries | length')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "| job | resultado |"
            echo "| --- | --- |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$skipped" ]; then
            echo "::warning::jobs saltados (no cuentan como fallo):$skipped"
          fi
          if [ -n "$failed" ]; then
            echo "::error::jobs no verdes: $failed"
            exit 1
          fi
          echo "$total jobs en verde."
          if [ -n "$skipped" ]; then
            echo "Saltados: $skipped"
          fi
