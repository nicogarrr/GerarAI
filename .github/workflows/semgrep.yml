name: Semgrep

# Analisis estatico con Semgrep.
# - semgrep-custom (BLOQUEANTE): reglas propias de .semgrep/gerarai.yml, las
#   clases de bug que ya nos mordieron (importe None -> 0, float ==, datetime
#   naive, except-pass, httpx sin public_fetch, falsos ORM en tests, SQL crudo
#   sobre tablas con tenant, dangerouslySetInnerHTML, secretos). Debe dar 0
#   hallazgos; un falso positivo se suprime con `# nosemgrep: <id> -- motivo`.
# - semgrep-registry (NO bloqueante): rulesets publicos (p/python, p/fastapi,
#   p/typescript, p/react, p/secrets, p/owasp-top-ten) + Bandit. Informan en
#   Security > Code scanning (SARIF); no rompen la PR.
# CodeQL ya corre en codeql.yml; pip-audit y npm audit en ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep-custom:
    name: Semgrep (reglas propias, bloqueante)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: python -m pip install "semgrep==1.182.1"
      - name: Reglas propias (0 hallazgos)
        run: semgrep scan --config .semgrep/gerarai.yml --error --metrics=off --timeout 60 .

  semgrep-registry:
    name: Semgrep registry + Bandit (informativo)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install "semgrep==1.182.1" "bandit[sarif]==1.9.4"
      - name: Semgrep registry rulesets
        run: >-
          semgrep scan --metrics=off --timeout 60
          --config p/python --config p/fastapi --config p/typescript
          --config p/react --config p/secrets --config p/owasp-top-ten
          --sarif --output semgrep-registry.sarif .
      # GitHub code scanning NO honora la propiedad SARIF `suppressions`
      # (github/codeql-action#1230, confirmado por GitHub: se ignora): cada
      # hallazgo suprimido con nosemgrep reapareceria como alerta NUEVA a cada
      # analisis (así reabrieron las 218-225 tras suprimir las 208-213). El
      # nosemgrep motivado queda en el codigo (y el texto del CLI lo muestra),
      # pero el SARIF subido solo lleva hallazgos activos; los suprimidos
      # desaparecen del upload y code scanning los cierra como fixed.
      - name: Quitar del SARIF los hallazgos suprimidos con nosemgrep
        run: python scripts/filter_sarif_suppressions.py semgrep-registry.sarif
      - name: Bandit (severidad media o mayor)
        run: bandit -r data-engine/app -ll -f sarif -o bandit.sarif || true
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-registry.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: semgrep-registry.sarif
          category: semgrep-registry
      - name: Upload Bandit SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: bandit.sarif
          category: bandit
