# SBOM + escaneo de seguridad de las 4 imagenes Docker del repo.
#
# POR QUE EXISTE ESTE WORKFLOW (tarea E3)
#
# Antes de el, el repo no construia ninguna imagen en CI, no generaba SBOM y no
# escaneaba imagenes: una CVE en la imagen de produccion no se enteraba hasta
# que algo se rompia en Oracle. El job `supply-chain` de ci.yml cubre el
# *codigo* (npm audit + pip_audit sobre requirements.txt); esto cubre el
# *entorno resultante*: el sistema operativo, las librerias que pip resolvio en
# el build, lo que quedo en las capas y el propio Dockerfile.
#
# Gates (por que cada puerta es la que es, no la que es comodo):
#
#   CVE CRITICAL con fix disponible .... ROJO.  Es la unica combinacion donde el
#     atacante tiene codigo publicado y nosotros tenemos el parche a una linea de
#     distancia: no esperar un trimestre a la proxima version.
#   secret en la imagen (CUALQUIER sev) ROJO.  Un token quemado en una capa sigue
#     quemado aunque se borre el fichero: `ENV`/`ARG` en el historial no se
#     des-cargan. Ademas el escaner no puede saber si "example" es de mentira.
#   misconfiguration HIGH/CRITICAL .... ROJO.  Corregible en el Dockerfile, sin
#     esperar a nadie, y es la causa de las RCE que terminan en root del host.
#   CVE HIGH/MEDIUM/LOW ............... se REPORTA con su numero en el log y en el
#     artefacto. Bloquear por un HIGH de una dependencia transitiva que nadie usa
#     enseña al equipo a ignorar el escaneo; se arregla en el PR de dependencia.
#   escaner que no se ejecuta .......... ROJO.  Fail-closed, mismo principio que
#     el gate de Qdrant de ci.yml (que falla si el test se salta): "no lo he
#     podido comprobar" jamas se reporta como "esta limpio".
#
# Lo que este workflow NO hace, a proposito:
#   - No usa secrets de Vercel ni de Docker Hub. `GITHUB_TOKEN` es lo unico que
#     necesita y corre en forks. El push a registry (attestations de buildx,
#     provenance) queda fuera: no se depende de ningun registry para dar el
#     veredicto.
#   - No repara los Dockerfile. Este workflow los mide; quien los arregla esta en
#     el informe de E3 y en el PR correspondiente.
#
# Las excepciones viven en scripts/security/trivy-policy.yaml (versionado, con
# motivo + ticket + fecha de caducidad). No hay `--ignore` ni `exit-code` que
# decidan por su cuenta: el unico veredicto es el exit code de
# data-engine/scripts/security/gate_image_scan.py, que ademas es testeable sin
# docker (data-engine/tests/test_supply_chain_contracts.py).
name: SBOM + escaneo de seguridad de imagenes

on:
  push:
    branches: [main]
  # En PR solo corre si toca lo que puede mover el veredicto del escaneo:
  # los 4 Dockerfiles, los .dockerignore (un secreto en el contexto se
  # publica en la capa), los manifests de dependencias (las CVE salen de lo
  # que fijan package-lock.json y uv.lock/requirements.txt, no del codigo
  # fuente) y la politica de excepciones con su gate. Un PR de solo codigo
  # no cambia la postura de CVE y antes construia 4 imagenes igualmente.
  # En push a main y workflow_dispatch corre SIEMPRE, sin filtro.
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.dev"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "data-engine/Dockerfile"
      - "data-engine/Dockerfile.prod"
      - "data-engine/.dockerignore"
      - "data-engine/pyproject.toml"
      - "data-engine/uv.lock"
      - "data-engine/requirements.txt"
      - "scripts/security/**"
      - ".github/workflows/sbom-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-scan-${{ github.workflow }}-${{ github.ref }}
  # PR -> true: el run viejo ya no describe el codigo que se revisa.
  # push -> false: este workflow PUBLICA SBOMs e informes de escaneo como
  #   artefactos. Cancelar un push a mitad deja el commit sin la evidencia
  #   que justifica el gate: la evidencia publicada no se cancela (mismo
  #   criterio que coverage.yml y llm-evals.yml, y que el comentario de
  #   ci.yml ya atribuia a este workflow).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) BUILD: las 4 imagenes, cache en el propio runner, sin registry.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # `actions: write` solo para el backend de cache `type=gha` de buildx, que
      # es lo que hace que sbom/scan reconstruyan en segundos en vez de repetir
      # la descarga de los wheels de torch.
      actions: write
    strategy:
      # fail-fast: false = una imagen rota no oculta los resultados de las otras
      # tres. El veredicto global lo cierra igualmente el gate de scan.
      fail-fast: false
      matrix:
        include:
          - name: frontend-prod
            context: .
            file: Dockerfile
            production: "true"
          - name: frontend-dev
            context: .
            file: Dockerfile.dev
            production: "false"
          - name: backend-prod
            context: data-engine
            file: data-engine/Dockerfile.prod
            production: "true"
          - name: backend-dev
            context: data-engine
            file: data-engine/Dockerfile
            production: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: "Construir ${{ matrix.name }} (sin push: no depende de registry)"
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: cavaai/${{ matrix.name }}:${{ github.sha }}
          load: true
          # push:false a proposito. Las attestations de buildx (sbom/provenance)
          # solo existen cuando hay un registry al que empujarlas; el SBOM de
          # este repo lo genera el job `sbom` y no depende de donde se publique.
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=img-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=img-${{ matrix.name }}

      - name: Registrar digest y usuario efectivo
        # El digest es lo unico que identifica el contenido escaneado; sin el,
        # un informe de CVEs no se puede relacionar con la imagen que se
        # desplego. El usuario efectivo se registra porque un contenedor en root
        # convierte una RCE de la app en root sobre los volumenes montados.
        run: |
          set -euo pipefail
          mkdir -p digests
          ref="cavaai/${{ matrix.name }}:${{ github.sha }}"
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="$(docker image inspect --format '{{.Id}}' "$ref")"
          fi
          user="$(docker image inspect --format '{{.Config.User}}' "$ref")"
          printf 'image\tdigest\tuser\tproduction\t%s\n' "$digest" "${user:-<root:0>}" \
            "${{ matrix.production }}" | tee -a "digests/${{ matrix.name }}.tsv"
          docker image inspect "$ref" --format 'User={{.Config.User}} Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.tsv
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2) SBOM: CycloneDX y SPDX por imagen, subidos SIEMPRE como artefacto.
  #    `if: always()` en el job y en la subida: un SBOM que solo existe si todo
  #    fue bien no sirve en una investigacion posterior a un incidente.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM ${{ matrix.name }}
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # Misma lista que el job build. test_supply_chain_contracts.py verifica
        # que las tres matrices declaran las mismas 4 imagenes.
        include:
          - name: frontend-prod
            context: .
            file: Dockerfile
            production: "true"
          - name: frontend-dev
            context: .
            file: Dockerfile.dev
            production: "false"
          - name: backend-prod
            context: data-engine
            file: data-engine/Dockerfile.prod
            production: "true"
          - name: backend-dev
            context: data-engine
            file: data-engine/Dockerfile
            production: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reconstruir desde la cache del job build
        # Sin registry no hay forma de pasar la imagen entre jobs: se reconstruye
        # y la cache `type=gha` que dejo el job build lo convierte en una capa.
        # El contexto es el mismo commit, asi que es el mismo contenido.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: cavaai/${{ matrix.name }}:${{ github.sha }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=img-${{ matrix.name }}

      - name: Crear el directorio de salida del SBOM
        run: mkdir -p sbom

      - name: SBOM CycloneDX (syft via anchore/sbom-action)
        id: sbom-cyclonedx
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: cavaai/${{ matrix.name }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom/${{ matrix.name }}.cdx.json
          # La subida la hace el paso siguiente con `if: always()`: la interna de
          # la action no existe si la action falla, que es justo cuando hace falta.
          upload-artifact: false
          dependency-snapshot: false

      - name: SBOM SPDX (syft via anchore/sbom-action)
        id: sbom-spdx
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: cavaai/${{ matrix.name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom/${{ matrix.name }}.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Subir SBOM CycloneDX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: sbom-${{ matrix.name }}-cyclonedx
          path: sbom/${{ matrix.name }}.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: Subir SBOM SPDX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: sbom-${{ matrix.name }}-spdx
          path: sbom/${{ matrix.name }}.spdx.json
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2b) MOTOR 2 en su propio job: grype sobre el SBOM ya generado. Dentro del job
  # scan, el runner de backend-prod recibia "shutdown signal" en grype (4
  # intentos, siempre ahi; disco y memoria sobrados). Un runner limpio por
  # imagen que solo corre grype. Si muere, no sube artefacto y el gate lo lee
  # como "missing" (rojo), nunca como verde.
  # ---------------------------------------------------------------------------
  engine2:
    name: Motor 2 ${{ matrix.name }}
    needs: [sbom]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [frontend-dev, frontend-prod, backend-dev, backend-prod]
    steps:
      - name: SBOM del job sbom
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom-${{ matrix.name }}-cyclonedx
          path: sbom
          if-no-files-found: ignore

      - name: Crear el directorio de informes
        run: mkdir -p reports

      - name: Copia del SBOM para grype sin componentes machine-learning-model
        # Reproducido en local (grype 0.118.0, DB 2026-10-02): el SBOM de
        # backend-prod, identico al de backend-dev salvo 1 componente
        # `machine-learning-model` (el modelo safetensors de /opt/hf, sin purl ni
        # version), deja a grype girando sin salida (>100 s, exit 124 por
        # timeout) y en el runner acaba en "shutdown signal" (4 intentos, tambien
        # en un runner limpio). Sin ese componente grype termina en 18 s. Un
        # modelo de pesos no es un paquete con CVEs que grype pueda casar; el
        # SBOM publicado como artefacto conserva el componente, solo se quita de
        # la copia que lee grype. Se registra cuantos se quitan.
        run: |
          python3 - <<'PY'
          import json
          import os
          src = "sbom/${{ matrix.name }}.cdx.json"
          dst = "sbom/${{ matrix.name }}.grype.cdx.json"
          bom = json.load(open(src, encoding="utf-8"))
          kept = [c for c in bom.get("components", []) if c.get("type") != "machine-learning-model"]
          quitados = len(bom.get("components", [])) - len(kept)
          print(f"componentes: {len(bom.get('components', []))}, quitados para grype: {quitados}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  f"Motor 2 ${{ matrix.name }}: {quitados} componente(s) machine-learning-model "
                  "fuera del escaneo de CVEs (modelos de pesos, no paquetes; "
                  "siguen en el SBOM publicado).\n"
              )
          bom["components"] = kept
          json.dump(bom, open(dst, "w", encoding="utf-8"))
          PY

      - name: "Motor 2: anchore/scan-action (grype sobre el SBOM)"
        id: anchore_scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom/${{ matrix.name }}.grype.cdx.json
          output-format: json
          output-file: reports/anchore-${{ matrix.name }}.json
          # El veredicto lo da el gate, no el corte binario de la action.
          fail-build: false

      - name: Resultado del motor 2
        if: ${{ always() }}
        run: echo "${{ steps.anchore_scan.outcome }}" > reports/status.txt

      - name: Subir informe del motor 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: engine2-${{ matrix.name }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 3) SCAN: dos motores independientes + gate con umbral.
  # ---------------------------------------------------------------------------
  scan:
    name: Scan ${{ matrix.name }}
    needs: [build, sbom, engine2]
    # always() + gate explicito: si build o sbom fallaron, este job corre igual
    # y el gate dice POR QUE esta en rojo. Un job saltado se lee como verde.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # 60 min y no 40: en la auditoria E3 el analisis de trivy de la imagen de
    # backend (3,4 GB) se comio mas de 25 min solo, y este job encadena
    # reconstruccion + vuln + secrets + misconfig + motor 2 + gate.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend-prod
            context: .
            file: Dockerfile
            production: "true"
          - name: frontend-dev
            context: .
            file: Dockerfile.dev
            production: "false"
          - name: backend-prod
            context: data-engine
            file: data-engine/Dockerfile.prod
            production: "true"
          - name: backend-dev
            context: data-engine
            file: data-engine/Dockerfile
            production: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Dependencias del gate (pyyaml)
        run: python -m pip install --disable-pip-version-check pyyaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reconstruir desde la cache del job build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: cavaai/${{ matrix.name }}:${{ github.sha }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=img-${{ matrix.name }}

      - name: Informe del motor 2 (job engine2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: engine2-${{ matrix.name }}
          path: engine2
          if-no-files-found: ignore

      - name: Digest del build de ESTA imagen
        # needs.build.result es el resultado AGREGADO de las 4 imagenes de la
        # matriz build: con una rota llegaba 'failure' a los 4 gates y el
        # escaneo de una imagen sana salia rojo por "sin imagen" teniendola
        # (medido 30-oct-2026, run 41005146082: backend-prod, backend-dev y
        # frontend-dev rojos con imagen, SBOM e informes presentes y gate que
        # da VERDE sobre sus informes reales). El artefacto digest-<imagen>
        # solo existe si el paso "Registrar digest" corrio, es decir si el
        # build de ESTA imagen termino bien: es la señal por imagen.
        id: build_digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # pattern + merge-multiple: sin artefacto el paso NO falla (avisa y
          # sigue); el contrato del workflow prohibe continue-on-error.
          pattern: digest-${{ matrix.name }}
          path: digests/
          merge-multiple: true

      - name: Resultado del build de esta imagen
        id: build_result
        run: |
          if [ -f "digests/${{ matrix.name }}.tsv" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear el directorio de informes y recoger el motor 2
        id: engine2_result
        run: |
          mkdir -p reports
          # Si engine2 murio (runner caido) no hay artefacto: estado "missing",
          # que el gate lee como escaneo incompleto (fail-closed), no como verde.
          status=missing
          if [ -f engine2/status.txt ]; then status=$(cat engine2/status.txt); fi
          if [ -f engine2/anchore-${{ matrix.name }}.json ]; then
            cp engine2/anchore-${{ matrix.name }}.json reports/
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: "Motor 1: trivy sobre la imagen (vuln)"
        id: trivy_vuln
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cavaai/${{ matrix.name }}:${{ github.sha }}
          format: json
          output: reports/trivy-vuln-${{ matrix.name }}.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          # Los CVEs sin fix tambien se listan: que no haya parche es informacion,
          # no una excusa para no mirar.
          ignore-unfixed: false
          # exit-code 0 a proposito: el umbral de la politica (solo CRITICAL con
          # fix) lo aplica gate_image_scan.py. Con exit-code 1, trivy fallaria
          # tambien por un HIGH de una dependencia transitiva.
          exit-code: "0"
          # Medido en la auditoria E3: el analisis de la imagen de backend
          # (3,4 GB, ~150 paquetes) se pasa del default de 5 min de trivy por
          # poco. Un timeout aqui es un build rojo que no significa ni una CVE
          # ni un fallo: es la razon de que el gate sea fail-closed.
          timeout: 25m

      - name: "Motor 1: trivy sobre la imagen (secret)"
        id: trivy_secret
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Paso aparte, no por coste: un secret solo se detecta en las capas de la
          # imagen, y asi el informe de secrets y el de CVEs no se pisan. Si uno
          # de los dos escaneres no llega a correr, el gate lo nota por separado.
          image-ref: cavaai/${{ matrix.name }}:${{ github.sha }}
          format: json
          output: reports/trivy-secret-${{ matrix.name }}.json
          scanners: secret
          exit-code: "0"
          timeout: 15m

      - name: "Motor 1: trivy misconfiguration (los 4 Dockerfiles + los 2 compose)"
        id: trivy_misconfig
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Se evalua el repo entero, no solo el Dockerfile de esta imagen: una
          # imagen de produccion tampoco es segura si el compose que la levanta
          # la monta en root sobre un volumen con datos.
          scan-type: config
          scan-ref: .
          scanners: misconfig
          format: json
          output: reports/trivy-misconfig-${{ matrix.name }}.json
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "0"

      - name: Puerta (unico punto de decision, rojo/verde)
        # Sin `continue-on-error` y con `if: always()`: este paso corre siempre y
        # su exit code es el veredicto de la imagen. Los `outcome` de cada
        # escaner se le pasan porque "no se ejecuto" != "0 hallazgos"; si un paso
        # quedo skipped, el gate sale en rojo por eso y no por lo que hubiera
        # encontrado.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python data-engine/scripts/security/gate_image_scan.py \
            --image "${{ matrix.name }}" \
            --image-ref "cavaai/${{ matrix.name }}:${{ github.sha }}" \
            --build-result "${{ steps.build_result.outputs.result }}" \
            --policy scripts/security/trivy-policy.yaml \
            --vuln-report "reports/trivy-vuln-${{ matrix.name }}.json" \
            --vuln-status "${{ steps.trivy_vuln.outcome || 'skipped' }}" \
            --secret-report "reports/trivy-secret-${{ matrix.name }}.json" \
            --secret-status "${{ steps.trivy_secret.outcome || 'skipped' }}" \
            --misconfig-report "reports/trivy-misconfig-${{ matrix.name }}.json" \
            --misconfig-status "${{ steps.trivy_misconfig.outcome || 'skipped' }}" \
            --second-report "reports/anchore-${{ matrix.name }}.json" \
            --second-status "${{ steps.engine2_result.outputs.status || 'skipped' }}" \
            --summary "reports/summary-${{ matrix.name }}.json"

      - name: Subir informes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: reports-${{ matrix.name }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90