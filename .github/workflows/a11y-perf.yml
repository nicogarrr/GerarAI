name: a11y-perf (axe + Lighthouse)

# Barrido de accesibilidad y rendimiento de las pantallas firmadas.
# NO bloquea: no está en ci.yml ni en el gate; corre a mano y cada noche.
#
# - axe: e2e/a11y-routes-axe.spec.ts (axe-core 4.14 vía @axe-core/playwright),
#   14 pantallas x escritorio/375 px con datos sembrados. Presupuesto: 0
#   violaciones serias o críticas por pantalla, 0 heading-order en /portfolio y
#   /taxes, y 0 avisos de hidratación en consola. Más e2e/a11y-app-axe.spec.ts.
# - lighthouse: build de producción + sesión real (scripts/lhci/session.mjs)
#   sobre inicio, watchlist, ficha, cartera, impuestos y Cerebro.
#   Presupuesto en scripts/lhci/lighthouserc.js. Informes como artefacto.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref a medir (rama, tag o SHA; vacío = la rama del disparo). Para A/B: dos disparos manuales, uno por ref."
        required: false
        default: ""
  schedule:
    - cron: "40 3 * * *"

permissions:
  contents: read

concurrency:
  # El input ref entra en el grupo: un A/B manual (base y rama) no se cancela
  # entre sí; el nocturno (sin input) mantiene su grupo original.
  group: a11y-perf-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe (0 serias/críticas)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      E2E_UI_RUN: "1"
      E2E_A11Y_RUN: "1"
      RESEARCH_AUTH_SECRET: cavaai-browser-e2e-research-secret-at-least-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/cavaai_e2e
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 1
      - name: Slug del ref para artefactos
        run: |
          echo "REF_SLUG=$(echo "${{ inputs.ref }}" | tr '/:' '--')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - run: python -m pip install -r data-engine/requirements.txt
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache del navegador de Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Dependencias de sistema de Chromium (apt)
        timeout-minutes: 15
        run: npx playwright install-deps chromium
      - name: Descarga de Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Barrido axe
        run: npx playwright test e2e/a11y-routes-axe.spec.ts e2e/a11y-app-axe.spec.ts --workers=1
      - name: Informe de Playwright
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a11y-axe-playwright${{ env.REF_SLUG && format('-{0}', env.REF_SLUG) || '' }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (pantallas clave)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      NODE_ENV: production
      RESEARCH_AUTH_SECRET: cavaai-lhci-research-secret-at-least-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/cavaai_lhci
      BETTER_AUTH_SECRET: cavaai-lhci-better-auth-secret-at-least-32-chars
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      ALLOW_PUBLIC_SIGNUP: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"
      RESEARCH_AUTH_REQUIRED: "true"
      FMP_BACKEND_URL: http://127.0.0.1:8100
      LHCI_BASE_URL: http://127.0.0.1:3000
      LHCI_BACKEND_URL: http://127.0.0.1:8100
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 1
      - name: Slug del ref para artefactos
        run: |
          echo "REF_SLUG=$(echo "${{ inputs.ref }}" | tr '/:' '--')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - run: python -m pip install -r data-engine/requirements.txt
      - name: Build de producción
        run: npm run build
      - name: Backend (APP_ENV=test, SQLite)
        working-directory: data-engine
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./cavaai_lhci.db
          RESEARCH_AUTH_MAX_AGE_SECONDS: "3600"
          CAVAAI_ENABLE_VECTOR_INGEST: "0"
          CAVAAI_ENABLE_VECTOR_CHAT: "0"
          SCREENER_QUOTE_VENDOR: offline
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8100 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8100/health && break; sleep 2; done
      - name: Frontend (next start)
        run: |
          nohup npx next start --hostname 127.0.0.1 --port 3000 > frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/sign-in && break; sleep 2; done
      - name: Sesión real + siembra
        run: node scripts/lhci/session.mjs
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=scripts/lhci/lighthouserc.js
      - name: Informes de Lighthouse y logs
        # Incluye los LHR JSON por corrida (.lighthouseci/reports/*.json) para
        # comparar antes/después con el mismo método: dos disparos manuales con
        # inputs.ref = base y rama, y diff de largest-contentful-paint.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a11y-lighthouse${{ env.REF_SLUG && format('-{0}', env.REF_SLUG) || '' }}
          path: |
            .lighthouseci/
            backend.log
            frontend.log
          if-no-files-found: ignore
          retention-days: 14
