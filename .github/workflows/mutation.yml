name: Mutation testing (manual)

# Mutation testing (mutmut / Stryker): mide si los tests detectarian un fallo
# real en los modulos de mas riesgo (dinero, fiscalidad, DCA, puerta de tesis).
# NO es un gate: se lanza a mano y nunca bloquea un PR. Cada modulo tarda
# minutos; el job completo puede pasar de media hora. Ver docs/testing/mutation.md.

on:
  workflow_dispatch:
    inputs:
      backend_module:
        description: "Modulo Python (scripts/mutation/run_mutmut.py --list) o 'none'"
        required: true
        default: dca_signal_engine
        type: choice
        options:
          - none
          - currency
          - dca_signal_engine
          - dca_signal_service
          - fx_attribution
          - portfolio_fx_service
          - portfolio_snapshot_service
          - price_units
          - tax_irpf_filing
          - tax_modelo720_service
          - thesis_publication_gate
          - units
      frontend:
        description: "Correr Stryker sobre lib/ (dca, portfolio-allocation, sort-rows, quote-freshness)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    if: ${{ inputs.backend_module != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "mutmut>=3.8,<4"
      - name: mutmut
        run: |
          set -o pipefail
          python scripts/mutation/run_mutmut.py "${{ inputs.backend_module }}" --max-children 4 --survivors \
            | tee mutation-report.txt
          tail -n 1 mutation-report.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutmut-${{ inputs.backend_module }}
          path: data-engine/mutation-report.txt

  frontend:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm i --no-save --no-audit --no-fund @stryker-mutator/core@9 @stryker-mutator/vitest-runner@9
      - run: npx stryker run stryker.conf.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
