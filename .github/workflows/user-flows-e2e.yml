name: user-flows E2E (smoke, no bloquea)

# Suite de flujos de usuario en navegador real (e2e/user-flows): sign-in,
# watchlist (US/.L/.PA), ficha, cartera (CSV IBKR en-US y es-ES con «;»),
# impuestos (IRPF + 720), alertas, divisa base, 404 y Cerebro (LLM simulado),
# cada una en escritorio 1280x800 y móvil 375x812. En cada página: sin errores
# de consola, sin 4xx/5xx inesperados, sin desborde horizontal, sin
# NaN/undefined/null/Infinity/[object Object] visibles.
#
# NO bloquea: job aparte (continue-on-error) que no está en el gate. El job
# «Browser E2E» de ci.yml no la corre (exige E2E_USER_FLOWS=1). Presupuesto de
# la suite: < 5 min (paso con timeout-minutes: 5). Sin red ni claves: backend
# APP_ENV=test con SQLite nueva y SCREENER_QUOTE_VENDOR=offline (webServer de
# playwright.config.ts).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-flows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-flows:
    name: User flows (smoke, no bloquea)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    env:
      CI: "true"
      E2E_UI_RUN: "1"
      E2E_USER_FLOWS: "1"
      RESEARCH_AUTH_SECRET: cavaai-browser-e2e-research-secret-at-least-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/cavaai_e2e
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - run: python -m pip install -r data-engine/requirements.txt
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache del navegador de Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Dependencias de sistema de Chromium (apt)
        timeout-minutes: 15
        run: npx playwright install-deps chromium
      - name: Descarga de Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Suite de flujos de usuario
        timeout-minutes: 5
        run: npx playwright test e2e/user-flows --workers=1
      - name: Informe y trazas
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: user-flows-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
