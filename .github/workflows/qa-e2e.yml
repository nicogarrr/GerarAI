name: QA e2e (solo lectura)

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

# Los eventos deployment_status de previews (que el job omite) no deben cancelar
# un run real: el grupo depende del entorno del deploy o del run manual.
concurrency:
  group: qa-e2e-${{ github.event.deployment_status.environment || github.run_id }}
  cancel-in-progress: false

jobs:
  qa:
    # Tras un deploy correcto de Vercel a produccion, o a mano.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qa-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Instala dependencias y Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # POR QUE UN PRECHECK: si el endpoint de OpenCode Go no responde con la
      # clave del repo, este workflow se pone en rojo en TODOS los deploys. Un
      # proveedor caido no es un bug del producto: con el precheck, la pasada
      # de agente se salta con aviso grande en el summary y los tests
      # DETERMINISTAS (Playwright puro, sin LLM) siguen gateando el producto.
      # Cuando el proveedor vuelva, la pasada de agente se reanuda sola en el
      # siguiente run.
      # La llamada replica exactamente el cliente de e2e.config.ts (misma
      # baseURL, cabecera de sesion, User-Agent y modelo), asi que un 200
      # aqui significa que los tests de agente pueden correr de verdad.
      - name: Precheck del proveedor (OpenCode Go)
        id: zen
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "agent=0" >> "$GITHUB_OUTPUT"
            echo "reason=Falta el secret de repo OPENCODE_API_KEY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /tmp/zen-precheck.json -w '%{http_code}' --max-time 30 \
            -X POST "${ZEN_BASE_URL:-https://opencode.ai/zen/go/v1}/chat/completions" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "x-opencode-session: ${ZEN_SESSION_ID:-cavaai-e2e-readonly}" \
            -H "User-Agent: curl/8.5.0" \
            -H "Content-Type: application/json" \
            -d '{"model":"'"${ZEN_MODEL:-deepseek-v4.1-flash}"'","messages":[{"role":"user","content":"responde ok"}],"max_tokens":1}')
          echo "http=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "agent=1" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          else
            echo "agent=0" >> "$GITHUB_OUTPUT"
            echo "reason=El proveedor OpenCode Go respondio HTTP $code (clave sin suscripcion, modelo no disponible o proveedor caido)" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pasada de agente NO ejecutada::El proveedor OpenCode Go respondio HTTP $code; solo corren los tests deterministas."
            # El cuerpo puede dar una pista (sin secretos: la clave viaja en
            # la cabecera de la peticion, no en la respuesta).
            head -c 300 /tmp/zen-precheck.json || true
          fi

      - name: Ejecuta e2e (paginas publicas y rutas autenticadas)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # 1 = el precheck confirmo que el proveedor responde: corren tambien
          # los tests de agente. 0 = esos tests se saltan con razon registrada
          # (ver SKIP_AGENT en qa-e2e/tests/) y el run cierra con los
          # deterministas.
          E2E_AGENT: ${{ steps.zen.outputs.agent }}
          # Cuenta que indiquen estos secrets (la cuenta indicada, con autorizacion; solo lectura,
          # escrituras bloqueadas en el navegador). Si los secrets
          # no existen, tests/authenticated.e2e.ts se salta y el resumen lo indica.
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          set +e
          npx e2e run 2>&1 | tee run.log
          echo "${PIPESTATUS[0]}" > exit.code

      - name: Resumen del run
        if: always()
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          AGENT_OK: ${{ steps.zen.outputs.agent }}
          AGENT_REASON: ${{ steps.zen.outputs.reason }}
        run: |
          {
            echo "### QA e2e (solo lectura) contra ${E2E_BASE_URL:-https://gerarai.vercel.app}"
            if [ "$AGENT_OK" != "1" ]; then
              echo
              echo "## ⚠️ PASADA DE AGENTE NO EJECUTADA"
              echo
              echo "**Motivo: ${AGENT_REASON:-precheck del proveedor fallido}.**"
              echo
              echo "Solo se ejecutaron los tests deterministas (Playwright, sin LLM). La auditoria de UI por agente queda pendiente de que el proveedor OpenCode Go vuelva a responder; este verde NO la cubre."
              echo
            fi
            if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
              echo "**Rutas autenticadas NO ejecutadas: faltan los secrets E2E_USER_EMAIL / E2E_USER_PASSWORD (solo se probaron las paginas publicas).**"
            fi
            echo "Resultado: salida $(cat exit.code 2>/dev/null || echo n/d)"
            echo
            echo "#### Problemas de UI detectados"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' run.log | grep -E '^\[[a-z]+\]' || echo "ninguno extraido"
            echo '```'
            echo
            echo "#### Pruebas"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' run.log | grep -i -E 'pass|fail|✓|×|error' | head -40 || true
            echo '```'
            echo
            echo "#### Uso de tokens (pasada de agente)"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' run.log | grep -E '\([0-9][0-9.,kM ]*(in|out|tokens)' || echo "El proveedor no reporto usage por llamada o no hubo pasada de agente."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: qa-e2e-resultados
          path: qa-e2e/test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Falla si el e2e falla
        run: test "$(cat exit.code)" = "0"
