name: Orden aleatorio (pytest-randomly)

# Suite backend en ORDEN ALEATORIO, cada noche y a mano. NO bloquea PRs.
#
# Por que: un test que solo pasa porque otro corrio antes (tablas creadas por
# otro test, un monkeypatch que se filtra, filas de otro tenant en la BD de la
# sesion) es verde en `ci.yml` y rojo el dia que alguien reordena o lo corre
# solo. La ronda del 28-oct-2026 encontro asi 3 tests que fallaban al correr
# solos (router_contracts /api/news sin tablas, ticker_news_lane con un fake
# que no devolvia bytes, tenant_llm_settings contando filas de otros tests).
#
# Si falla: el paso "Suite en orden aleatorio" imprime `pytest-randomly seed: N`
# (con -q el plugin no llega a imprimir su cabecera). Reproduce en local con
#   python -m pytest -p randomly --randomly-seed=N <tests que fallan>
# o lanza este workflow a mano con ese seed.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed de pytest-randomly (vacio = aleatorio)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: random-order
  cancel-in-progress: true

jobs:
  random-order:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_random.db
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
      # Redis del job declarado desechable: sin este opt-in el conftest no
      # reasigna DB por worker ni limpia coalesce/leases/pacers/breakers y el
      # estado se fuga entre tests en orden aleatorio (rojo cronico del job).
      TEST_REDIS_EPHEMERAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      - run: uv sync --frozen --extra test --no-install-project
      # pytest-randomly NO entra en el lock ni en requirements: instalado en
      # ci.yml baraja el orden de TODOS los jobs. Solo aqui.
      - run: uv pip install "pytest-randomly==5.0.0"
      - name: Redis local para tests de admision atomica
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Suite en orden aleatorio
        env:
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set -o pipefail
          # Seed siempre conocida y reproducible: con -q pytest-randomly no
          # imprime "Using --randomly-seed=N", asi que la generamos aqui cuando
          # no viene del input y queda registrada en el log.
          SEED="${SEED:-$((RANDOM * 32768 + RANDOM))}"
          echo "pytest-randomly seed: $SEED"
          SEED_ARG="--randomly-seed=$SEED"
          # test_divisa_base::test_fiscalidad_en_eur...: rojo conocido en main
          # (criterio DGT de #2581 vs ese test de #2376), pendiente de Nico.
          # Quitar el --deselect cuando se decida.
          uv run --no-sync python -m pytest -n 2 -m "not services" -p randomly $SEED_ARG \
            --deselect tests/test_divisa_base.py::test_fiscalidad_en_eur_aunque_la_base_sea_usd \
            -q -W ignore 2>&1 | tee /tmp/random_order.log
