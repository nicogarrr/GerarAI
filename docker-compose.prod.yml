    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M

  # El frontend NO va aqui: Vercel sirve la app. Tenerlo en el compose
  # consumia CPU/RAM de la VM y no publicaba puertos utiles. Si algun dia se
  # sirve desde la VM, anadelo como servicio con perfil explicito y su limite.

volumes:
  postgres_data:
    name: cavaai-prod-postgres
  redis_data:
    name: cavaai-prod-redis
  qdrant_data:
    name: cavaai-prod-qdrant
  minio_data:
    name: cavaai-prod-minio
  garage_meta:
    name: cavaai-prod-garage-meta
  garage_data:
    name: cavaai-prod-garage-data
  duckdb_data:
    name: cavaai-prod-duckdb
  caddy_data:
    name: cavaai-prod-caddy
  caddy_config:
    name: cavaai-prod-caddy-config
