# ============================================================
# Docker Compose - Produccion personal (Oracle Ampere Always Free)
# ============================================================
# VM ARM64 existente (4 OCPU / 24 GB RAM), un solo usuario.
# Frontend Oracle aparte en docker-compose.frontend.yml; auth en Atlas.
# Comprobar tarifa real OCI: una cuota o presupuesto no es un tope monetario.
#
# Presupuesto de memoria: la suma de `memory` de TODOS los servicios es
# 12.032 MiB (11,75 GiB); worker default con 3 GiB tras OOM medido. El resto de la VM queda para el kernel, page cache y una swap de
# 2-4 GB (ver docs/oracle-setup.md). Los `cpus` son techos por servicio, no
# reservas: la VM tiene 4 OCPU y varios servicios pueden turnarse. No se
# supera este techo: el carril "computed" lo consume el worker-alerts (jobs
# cortos y diarios) en vez de anadir un contenedor nuevo.
#
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Requisitos: .env.production (ver docs/oracle-setup.md y scripts/deploy.sh)

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Entorno comun a backend, workers y scheduler. En forma de mapa para poder
# fusionarlo con `<<` en cada servicio: APP_ENV=production deja de depender de
# que cada bloque se acuerde de ponerlo, y las garantias de config.py
# (auth firmada, MinIO, pool de BD) se aplican en TODOS los procesos.
x-app-env: &app-env
  APP_ENV: production
  # APP_ENV=production hace que config.py exija el secret de identidad en TODO
  # proceso (los workers importan database.py -> get_settings() al arrancar):
  # sin esto crash-loop. Mismo valor obligatorio que el backend.
  RESEARCH_AUTH_REQUIRED: "true"
  RESEARCH_AUTH_SECRET: ${RESEARCH_AUTH_SECRET:?Obligatorio}
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env.production}@redis:6379/0
  KPI_QUEUE_MAX_PENDING: ${KPI_QUEUE_MAX_PENDING:-500}
  KPI_DEFER_LEASE_SECONDS: ${KPI_DEFER_LEASE_SECONDS:-900}
  QDRANT_URL: http://qdrant:6333
  VECTOR_STORE: qdrant
  # Backend de objetos: por defecto MinIO; el corte a Garage es solo cambiar
  # OBJECT_STORAGE_* en .env.production (docs/OBJECT_STORAGE_MIGRATION.md).
  MINIO_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER}}
  MINIO_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
  MINIO_REGION: ${OBJECT_STORAGE_REGION:-}
  MINIO_BUCKET: research
  # La SEC rechaza UAs con placeholders (403): sin un contacto real declarado
  # el compose no interpola y el deploy se detiene.
  SEC_USER_AGENT: ${SEC_USER_AGENT:?Define SEC_USER_AGENT con un contacto real en .env.production}
  # Retencion operativa: el scheduler la necesita para el job privacy_retention
  # y MinIO/Qdrant para borrar originales, chunks y vectores. Sin estas
  # variables el job arrancaba pero no podia purgar storage.
  RETENTION_JOB_ENABLED: ${RETENTION_JOB_ENABLED:-false}
  RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-true}
  RETENTION_BATCH_LIMIT: ${RETENTION_BATCH_LIMIT:-500}
  FINANCIAL_DOCUMENT_RETENTION_DAYS: ${FINANCIAL_DOCUMENT_RETENTION_DAYS:-2555}
  CHAT_TELEMETRY_RETENTION_DAYS: ${CHAT_TELEMETRY_RETENTION_DAYS:-90}

# Pool de BD de los workers: 4 conexiones + 2 de overflow por proceso. Con 8
# workers + scheduler son ~54 conexiones, mas las 30 del backend (20+10): muy
# por debajo de max_connections=200 de Postgres.
x-worker-db-env: &worker-db-env
  DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-4}
  DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}

# Configuracion LLM compartida por los procesos que generan texto.
x-llm-env: &llm-env
  LLM_ENABLED: ${LLM_ENABLED:-true}
  LLM_PROVIDER: ${LLM_PROVIDER:-opencode-go}
  # Cifrado en reposo de las claves LLM por tenant (>=32 bytes). Sin ella la
  # API rechaza guardar claves con 503 y la UI muestra "cifrado no disponible".
  LLM_SETTINGS_ENCRYPTION_KEY: ${LLM_SETTINGS_ENCRYPTION_KEY:-}
  CHAT_TOTAL_TIMEOUT_SECONDS: ${CHAT_TOTAL_TIMEOUT_SECONDS:-45}
  # Respaldos gratuitos si cae OpenCode Go (Groq -> Gemini; OpenRouter :free
  # tras Groq). `auto` (defecto) = cada uno entra SOLO si tiene clave y las
  # confirmaciones de plan gratuito (Groq ademas ZDR); sin clave se salta.
  # `false` lo apaga aunque haya clave; `true` lo exige (falla si falta algo).
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_CHAT_FALLBACK_ENABLED: ${GROQ_CHAT_FALLBACK_ENABLED:-auto}
  GROQ_FREE_PLAN_CONFIRMED: ${GROQ_FREE_PLAN_CONFIRMED:-false}
  GROQ_ZDR_CONFIRMED: ${GROQ_ZDR_CONFIRMED:-false}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_CHAT_FALLBACK_ENABLED: ${GEMINI_CHAT_FALLBACK_ENABLED:-auto}
  GEMINI_FREE_PLAN_CONFIRMED: ${GEMINI_FREE_PLAN_CONFIRMED:-false}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
  OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
  OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
  OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-deepseek-v4.1-flash}
  OPENCODE_GO_REASONING_EFFORT: ${OPENCODE_GO_REASONING_EFFORT:-high}
  OPENCODE_GO_REASONING_EFFORT_MODELS: ${OPENCODE_GO_REASONING_EFFORT_MODELS:-deepseek-v4.1-flash,deepseek-v4.1-flash-free,space-bunny-free}
  OPENCODE_GO_CHAT_REASONING_EFFORT: ${OPENCODE_GO_CHAT_REASONING_EFFORT:-high}
  OPENCODE_GO_FALLBACK_MODEL: ${OPENCODE_GO_FALLBACK_MODEL:-}
  OPENCODE_GO_ALLOW_UNVERIFIED_MODEL: ${OPENCODE_GO_ALLOW_UNVERIFIED_MODEL:-false}
  LLM_MODEL_OVERRIDES: ${LLM_MODEL_OVERRIDES:-{}}
  CHAT_GO_SUBSCRIPTION_ENABLED: ${CHAT_GO_SUBSCRIPTION_ENABLED:-true}
  CHAT_GO_SUBSCRIPTION_BASE_URL: ${CHAT_GO_SUBSCRIPTION_BASE_URL:-https://opencode.ai/zen/go/v1}
  SECOND_ORDER_LLM_ENABLED: ${SECOND_ORDER_LLM_ENABLED:-0}
  ASTS_LLM_ENABLED: ${ASTS_LLM_ENABLED:-0}
  THESIS_NARRATIVE_LLM_ENABLED: ${THESIS_NARRATIVE_LLM_ENABLED:-0}

services:
  # TLS + reverse proxy hacia el backend (un subdominio DuckDNS gratis).
  caddy:
    image: caddy:2-alpine
    container_name: cavaai-caddy
    restart: unless-stopped
    ports:
      # BIND_IP configurable: por defecto 0.0.0.0 (VM normal). Si tailscaled
      # ocupa :443 en la IP tailnet, pon BIND_IP=<ip-privada-de-la-VM> en
      # .env.production (antes estaba fijada a 10.0.0.64). Ver oracle-setup.md.
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - BACKEND_DOMAIN=${BACKEND_DOMAIN:?Define BACKEND_DOMAIN (p.ej. 51.170.37.134.sslip.io) en .env.production}
    logging: *default-logging
    healthcheck:
      # Sin endpoint HTTP neutro (TLS/SNI depende del dominio): se verifica el binario.
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  postgres:
    # Datos solo en la red Docker. !reset elimina publicaciones heredadas.
    ports: !reset []
    image: postgres:17
    container_name: cavaai-postgres
    restart: unless-stopped
    # 200 conexiones: 30 del backend (20+10) + ~54 de los workers (4+2 cada
    # uno) + salud/diagnostico. Sin subirlo, el pool por defecto (100) dejaba
    # a los workers esperando conexiones bajo fan-out.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    # Sin puerto publico: solo red interna de compose.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-portfolio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.production}
      - POSTGRES_DB=${POSTGRES_DB:-cavaai_research}
      - TZ=UTC
      - SECOND_ORDER_LLM_ENABLED=${SECOND_ORDER_LLM_ENABLED:-0}
      - ASTS_LLM_ENABLED=${ASTS_LLM_ENABLED:-0}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
      - PGTZ=UTC
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-cavaai_research}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 896M

  redis:
    # Datos solo en la red Docker. !reset elimina publicaciones heredadas.
    ports: !reset []
    image: redis:7-alpine
    container_name: cavaai-redis
    user: redis
    restart: unless-stopped
    # Cola Dramatiq + cache; AOF para no perder jobs en reinicio.
    # maxmemory 768 MB: con 512 MB el backlog de ingesta expulsaba/fallaba
    # jobs legitimos (noeviction convierte presion en QueueCapacityError, no
    # en perdida silenciosa). Alerta operativa: `INFO memory` >
    # 80% de 768 MB o `LLEN` de colas creciendo durante >30 min.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env.production}
    # Generated secret must use letters/digits only (URL/config safe). Keep it
    # out of process arguments and logs; configuration file is mode 0600.
    command:
      - /bin/sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in *[!a-zA-Z0-9]*|"") echo "Invalid Redis secret format" >&2; exit 1;; esac
        umask 077
        printf 'appendonly yes\nmaxmemory 768mb\nmaxmemory-policy noeviction\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        exec redis-server /tmp/redis-auth.conf
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 896M

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: cavaai-qdrant
    restart: unless-stopped
    # Solo loopback: operaciones (snapshots) y diagnostico, sin exponer a internet.
    # !override: sin el, compose fusiona con el "6333:6333" de docker-compose.yml
    # y docker intenta bindear 6333 DOS veces (address already in use en cada
    # recreate; detectado y corregido 2026-10-16).
    ports: !override
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging
    healthcheck:
      # La imagen de Qdrant no incluye curl/wget: GET /healthz con bash (/dev/tcp).
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M

  minio:
    # Datos solo en la red Docker. !reset elimina publicaciones heredadas.
    ports: !reset []
    # Build local desde el codigo fuente de MinIO (la imagen de quay ya no es publica): docker/minio/Dockerfile.
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    image: cavaai-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: cavaai-minio
    restart: unless-stopped
    command: server --address ":9000" /data
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env.production}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env.production}
    logging: *default-logging
    healthcheck:
      # La imagen minio/minio no incluye curl/mc: sonda HTTP al endpoint live con bash (/dev/tcp).
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  garage:
    # Garage (S3 compatible, mantenido, nodo unico). Convive con MinIO durante
    # la migracion: MinIO no se toca hasta cerrar la migracion (rollback =
    # volver las variables OBJECT_STORAGE_* a su valor por defecto). Limite
    # ajustado porque en regimen normal solo MinIO sirve objetos.
    image: dxflrs/garage:v2.4.1
    container_name: cavaai-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?Define GARAGE_RPC_SECRET (openssl rand -hex 32) en .env.production}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_ACCESS_KEY:?Define GARAGE_ACCESS_KEY (GK + 24 hex) en .env.production}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_SECRET_KEY:?Define GARAGE_SECRET_KEY (64 hex) en .env.production}
      - GARAGE_DEFAULT_BUCKET=research
    logging: *default-logging
    healthcheck:
      # La imagen solo trae el binario /garage (sin shell ni curl).
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 192M

  backend:
    build:
      context: ./data-engine
      dockerfile: Dockerfile.prod
    image: cavaai-backend:prod
    container_name: cavaai-backend
    restart: unless-stopped
    environment:
      <<: [*app-env, *llm-env]
      EIA_API_KEY: ${EIA_API_KEY:-}
      IBKR_FLEX_TOKEN: ${IBKR_FLEX_TOKEN:-}
      IBKR_FLEX_QUERY_ID: ${IBKR_FLEX_QUERY_ID:-}
      IBKR_FLEX_TENANT_ID: ${IBKR_FLEX_TENANT_ID:-}
      IBKR_FLEX_ACCOUNT_ID: ${IBKR_FLEX_ACCOUNT_ID:-}
      IBKR_FLEX_COMPLETE_QUERY_ID: ${IBKR_FLEX_COMPLETE_QUERY_ID:-}
      # Version desplegada que expone /api/health (la imagen no lleva git):
      # se exporta al desplegar, p. ej. APP_VERSION=main-$(git rev-parse --short HEAD).
      APP_VERSION: ${APP_VERSION:-}
      # El scheduler corre en su propio servicio (cavaai-scheduler);
      # sin esto, el backend arrancaria una segunda copia embebida.
      WORKERS_ENABLED: "false"
      RESEARCH_AUTH_REQUIRED: "true"
      RESEARCH_AUTH_SECRET: ${RESEARCH_AUTH_SECRET:?Obligatorio}
      # Pool del backend: 30 conexiones como maximo (20 + 10 de overflow).
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      FMP_API_KEY: ${FMP_API_KEY:-}
      # Solo adiciones de mapeo: sin FINNHUB no hay screener Finnhub en prod
      # (fallback Yahoo); sin FRED no hay macro; sin TYPESAFE no hay Jev;
      # sin TELEGRAM_* no se envia nada (degradado a UI).
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SCREENER_QUOTE_VENDOR: ${SCREENER_QUOTE_VENDOR:-finnhub}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LINK_SECRET: ${TELEGRAM_LINK_SECRET:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_APPROVAL_ENABLED: ${TELEGRAM_APPROVAL_ENABLED:-false}
      INSIDER_ALERTS_ENABLED: ${INSIDER_ALERTS_ENABLED:-false}
      # Correo SMTP de alertas y senales DCA (vacio = sin correo).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      DCA_ALERTS_ENABLED: ${DCA_ALERTS_ENABLED:-true}
      DCA_ALERT_MIN_LEVEL: ${DCA_ALERT_MIN_LEVEL:-2}
      DCA_ALERT_TRIMS: ${DCA_ALERT_TRIMS:-false}
      DCA_ALERT_CHANNELS: ${DCA_ALERT_CHANNELS:-in_app,email}
      # Go DEDICADO solo a las narrativas de tesis (backend y worker-thesis). Defecto
      # apagado: mergear no activa gasto. La clave solo llega a estos dos servicios.
      THESIS_GO_ENABLED: ${THESIS_GO_ENABLED:-false}
      THESIS_GO_BASE_URL: ${THESIS_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      THESIS_GO_MODEL: ${THESIS_GO_MODEL:-deepseek-v4.1-flash}
      THESIS_GO_API_KEY: ${THESIS_GO_API_KEY:-}
      # RAG: sin =1 no hay ingesta/busqueda/chat vectorial (degradado a SQL).
      CAVAAI_ENABLE_VECTOR_INGEST: ${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      CAVAAI_ENABLE_VECTOR_SEARCH: ${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      CAVAAI_ENABLE_VECTOR_CHAT: ${CAVAAI_ENABLE_VECTOR_CHAT:-0}
      CHAT_GO_HEAD_START_SECONDS: ${CHAT_GO_HEAD_START_SECONDS:-2.0}
      DUCKDB_PATH: /data/analytics.duckdb
      # RAG de conocimiento profesional (#924): la API responde 503 mientras
      # el flag este a 0. La ingesta la hace worker-knowledge (cola knowledge).
      KNOWLEDGE_RAG_ENABLED: ${KNOWLEDGE_RAG_ENABLED:-0}
      # v2 = e5-large (1024 dims), coherente con knowledge_rag_dense_dims.
      KNOWLEDGE_RAG_COLLECTION: ${KNOWLEDGE_RAG_COLLECTION:-knowledge_rag_v2}
      KNOWLEDGE_RAG_INBOX_DIR: /data/knowledge-inbox
      KNOWLEDGE_RAG_MAX_FILE_MB: ${KNOWLEDGE_RAG_MAX_FILE_MB:-60}
      KNOWLEDGE_RAG_MIN_FREE_GB: ${KNOWLEDGE_RAG_MIN_FREE_GB:-3}
      KNOWLEDGE_RAG_RERANKER_MODEL: ${KNOWLEDGE_RAG_RERANKER_MODEL:-}
      FASTEMBED_CACHE_PATH: /data/fastembed-cache
      LANGFUSE_ENABLED: "false"
      SEC_SNAPSHOT_DIR: ${SEC_SNAPSHOT_DIR:-}
      SEC_HF_MIRROR_DATASET: ${SEC_HF_MIRROR_DATASET:-}
      ESEF_SNAPSHOT_DIR: ${ESEF_SNAPSHOT_DIR:-/data/esef-snapshots}
    volumes:
      - duckdb_data:/data
      - ./data-esef-snapshots:/data/esef-snapshots:ro
      - ./knowledge-inbox:/data/knowledge-inbox:ro
    logging: *default-logging
    healthcheck:
      # python:3.12-slim no trae curl: sonda equivalente a `curl -f http://localhost:8000/health/ready`.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  # worker: 1 thread evita solapar reconciliaciones de evidencia.
  # OOM confirmado 30-oct-2026 con 3 refresh_bottlenecks y limite 1280M.
  # 3G aporta margen, no demuestra ausencia de fuga. Historico: 3 threads (antes 6). Con 6 el proceso dramatiq llegaba al limite de 3G
  # (OOM de cgroup 24/10 19:09 y 19:13): el hijo muere por SIGKILL. Causa medida:
  # refresh_bottlenecks cargaba todos los chunks del tenant en memoria
  # (stored_evidence), y la concurrencia/redelivery de esos jobs sumaba memoria.
  # Bajar hilos mitiga, no corrige la carga; el fix esta en bottleneck_service.
  # Hilos por env (WORKER_THREADS, defecto 2) para subir de forma gradual SIN
  # redeploy de codigo: el worker es I/O-bound (CPU 0,17% medido con 8.709
  # pendientes, 31-oct piloto) y el pool de BD es por proceso (10+10), asi
  # que mas hilos no abren conexiones nuevas ni mas rate de proveedores (el
  # pacing 1,5 s es por peticion y el ritmo de encolado no cambia).
  # Escalado: 2 -> medir RSS -> 4. El historial OOM venia de N
  # refresh_bottlenecks concurrentes en memoria; ya hay streaming (yield_per),
  # pero se mide RSS antes de cada subida.
  worker:
    image: cavaai-backend:prod
    container_name: cavaai-worker
    restart: unless-stopped
    command: ["dramatiq", "app.workers.dramatiq_app", "--processes", "1", "--threads", "${WORKER_THREADS:-2}", "-Q", "default", "prices"]
    environment:
      <<: [*app-env, *worker-db-env, *llm-env]
      EIA_API_KEY: ${EIA_API_KEY:-}
